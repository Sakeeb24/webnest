<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071920" />
      <stop offset="50%" stop-color="#0B2630" />
      <stop offset="100%" stop-color="#051217" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D6B8" />
      <stop offset="50%" stop-color="#D8C7A5" />
      <stop offset="100%" stop-color="#BCA77F" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3B47" />
      <stop offset="100%" stop-color="#0D222A" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E4D5E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B2630" stop-opacity="0" />
    </radialGradient>
    <pattern id="coastalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#153B47" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#coastalGrid)" />
  <circle cx="600" cy="375" r="450" fill="url(#ambientGlow)" />

  <!-- Subtle Coastal Wave Contours -->
  <path d="M-100,550 C200,480 400,620 700,520 C1000,420 1150,560 1300,500 L1300,800 L-100,800 Z" fill="#06161D" opacity="0.6" />
  <path d="M-100,600 C250,550 500,660 800,580 C1100,500 1200,610 1300,570 L1300,800 L-100,800 Z" fill="#040F14" opacity="0.8" />

  <!-- Outer Framing -->
  <rect x="40" y="40" width="1120" height="670" rx="16" fill="none" stroke="#D8C7A5" stroke-width="1" stroke-opacity="0.25" />
  <rect x="52" y="52" width="1096" height="646" rx="12" fill="none" stroke="#1E4D5E" stroke-width="1" stroke-opacity="0.4" />

  <!-- Center Decorative Plate -->
  <g transform="translate(600, 340)">
    <!-- Plate base -->
    <circle cx="0" cy="0" r="190" fill="url(#plateGrad)" stroke="#D8C7A5" stroke-width="2" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="#D8C7A5" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="145" fill="#0A222B" stroke="#163945" stroke-width="1.5" />

    <!-- Stylized Fish Motif (Minimal Coastal Gastronomy) -->
    <path d="M -90,-10 C -40,-60 40,-60 90,-10 C 115,-30 130,-45 140,-45 C 135,-20 130,-5 135,10 C 130,25 135,40 140,45 C 130,45 115,30 90,10 C 40,60 -40,60 -90,10 C -105,5 -115,-5 -125,-10 C -115,-15 -105,-15 -90,-10 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Fish Eye & Fin Accents -->
    <circle cx="-65" cy="-2" r="3.5" fill="#D8C7A5" />
    <path d="M -15,-20 C 5,-20 15,-10 20,0" fill="none" stroke="#D8C7A5" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M -10,0 C 10,0 20,10 25,20" fill="none" stroke="#D8C7A5" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M -30,-5 C -20,-5 -10,0 -5,5" fill="none" stroke="#D8C7A5" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Garnish Dots -->
    <circle cx="35" cy="-75" r="4" fill="#D8C7A5" opacity="0.6" />
    <circle cx="50" cy="-65" r="2.5" fill="#D8C7A5" opacity="0.4" />
    <circle cx="-50" cy="70" r="3" fill="#D8C7A5" opacity="0.5" />
    <circle cx="-35" cy="80" r="2" fill="#D8C7A5" opacity="0.3" />
  </g>

  <!-- Top Badging -->
  <g transform="translate(600, 105)">
    <rect x="-135" y="-16" width="270" height="32" rx="16" fill="#12303C" stroke="#D8C7A5" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D8C7A5" letter-spacing="3">SEAFOOD RESTAURANT</text>
  </g>

  <!-- Restaurant Name -->
  <text x="600" y="180" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#F7F3EA" letter-spacing="6">ONLY FISH</text>
  <text x="600" y="210" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#A8BAC2" letter-spacing="4">DHARWAD, KARNATAKA</text>

  <!-- Bottom Location & Highlights Strip -->
  <g transform="translate(600, 595)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#D8C7A5" stroke-width="1" stroke-opacity="0.25" />
    <text x="0" y="32" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F7F3EA" letter-spacing="1">
      DINE-IN  •  TAKEAWAY  •  NO-CONTACT DELIVERY
    </text>
    <text x="0" y="54" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8DA3AC" letter-spacing="0.5">
      3rd Floor, Dharwad Business Center, PB Road, Gandhinagar
    </text>
  </g>

  <!-- WebNest Concept Note -->
  <g transform="translate(600, 680)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#6A808A" letter-spacing="1">
      WEBSITE CONCEPT BY WEBNEST
    </text>
  </g>
</svg>
